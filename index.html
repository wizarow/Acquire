/* Acquire. Every phase paints the whole screen in its own colour. */

:root{

/* ---------- palettes ---------- */
.scr{--bg:var(--cobalt);--fg:var(--cream);--btn:var(--saffron);--btn-fg:var(--ink);--hi:var(--saffron);--off:rgba(255,244,224,.24);--focus:var(--cream);

  background:var(--bg);color:var(--fg);max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.pal-yellow{--bg:var(--saffron);--fg:var(--ink);--btn:var(--ink);--btn-fg:var(--saffron);--hi:var(--ink);--focus:var(--ink);--off:rgba(20,17,15,.2);
  --chip:var(--cream);--chip-fg:var(--ink);--chip-line:var(--ink);--soft:rgba(20,17,15,.1);

.spicy.pal-yellow{--bg:var(--plum);--fg:var(--cream);--btn:var(--pink);--btn-fg:var(--plum);--hi:var(--pink);--focus:var(--pink);--off:rgba(255,244,224,.24);--chip:var(--plum-2);--chip-fg:var(--cream);--chip-line:var(--pink);--soft:var(--plum-2);

/* ---------- shared ---------- */
.pad{padding:20px var(--gut-r) 26px var(--gut-l);display:flex;flex-direction:column;gap:22px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.eyebrow.hi{color:var(--hi)}
.circle{width:52px;height:52px;flex:none;border-radius:26px;border:3px solid var(--fg);background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

.btn-main svg{flex:none}
.btn-main[disabled]{background:var(--rule);color:var(--muted);cursor:not-allowed}
.pal-green .btn-main[disabled],.pal-yellow .btn-main[disabled]{background:rgba(20,17,15,.28);color:var(--fg)}
.btn-main.sm{min-height:64px;font-size:min(30px,8vw)}

.btn-ghost.sm{min-height:50px;font-size:17px;border-radius:18px}
.btn-ghost[disabled]{opacity:.4;cursor:not-allowed}
.caption{font-size:15px;font-weight:600;text-align:center;line-height:1.3}
.note{font-size:15px;font-weight:600;line-height:1.3}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{min-height:28px;padding:0 10px;border-radius:14px;border:2px solid currentColor;display:inline-flex;align-items:center;font-size:13px;font-weight:800;white-space:nowrap}

/* ---------- home ---------- */

.wordmark{font-size:min(104px,25vw);line-height:.82;letter-spacing:-.01em}
.tagline{font-size:27px;line-height:1.15;font-weight:700;max-width:340px}
.hero{display:flex;flex-direction:column;gap:22px}

.topbtn{min-height:40px;padding:0 16px;border-radius:20px;border:3px solid var(--fg);background:transparent;color:var(--fg);display:inline-flex;align-items:center;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn-block{min-height:92px;border-radius:24px;border:none;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px 0 26px;cursor:pointer;width:100%;text-align:left}
.btn-block .t{display:flex;flex-direction:column;gap:3px}
.btn-block .disp{font-size:min(38px,9.5vw);line-height:.95}
.btn-block small{font-size:14px;font-weight:700}

/* ---------- join / seats ---------- */
.code-in{width:100%;height:96px;border-radius:24px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);text-align:center;font-family:var(--display);font-weight:900;font-size:68px;letter-spacing:.22em;padding-left:.22em;text-transform:uppercase;outline:none}
.code-in::placeholder{color:#B8AA92}

.seat:hover{background:var(--cream);color:var(--cobalt)}

/* ---------- room: lobby ---------- */
.setup .pad{gap:16px}

.mini{min-height:42px;padding:0 16px;border-radius:21px;border:none;background:var(--btn);color:var(--btn-fg);font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}

.sec{display:flex;flex-direction:column;gap:10px}

.who{font-size:18px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.stepper .minus{border:3px solid var(--fg);background:transparent;color:var(--fg)}
.stepper .plus{border:none;background:var(--btn);color:var(--btn-fg)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.count{width:76px;text-align:center;font-family:var(--display);font-weight:900;font-size:68px;line-height:.9;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border-radius:18px;background:var(--seg,var(--ink))}
.seg button{height:46px;border-radius:13px;border:none;background:transparent;color:var(--seg-fg,var(--cream));font-size:15px;font-weight:800;padding:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on,var(--saffron));color:var(--seg-on-fg,var(--ink))}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{min-height:50px;border-radius:14px;border:2.5px solid var(--tile-line,var(--ink));background:var(--tile,var(--cream));color:var(--tile-fg,var(--ink));font-size:15px;font-weight:800;line-height:1.05;padding:4px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile small{font-size:12px;opacity:.7}
.tile.wild{background:var(--ink);color:var(--saffron);border-color:var(--ink);grid-column:1/-1}
.spicy .tile.wild{background:transparent;color:var(--cream);border-color:var(--cream)}
.tile.spice{background:var(--plum);color:var(--pink);border-color:var(--plum)}
.spicy .tile.spice{background:var(--pink);color:var(--plum);border-color:var(--pink)}
.tile.picked{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg)}
.more{min-height:40px;border-radius:20px;border:2.5px dashed currentColor;background:transparent;color:inherit;font-size:14px;font-weight:800;cursor:pointer;align-self:center;padding:0 18px}
.text-in{height:60px;width:100%;border-radius:18px;border:3px solid var(--ink);background:var(--cream);padding:0 16px;font-size:19px;font-weight:700;color:var(--ink);outline:none}
.spicy .text-in{border-color:var(--pink)}
.text-in::placeholder{color:#6B5E4A}
.text-in:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.startbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:2;margin-top:auto}
.status-card{border-radius:24px;background:var(--soft);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.status-card .disp{font-size:34px;line-height:.95}
.status-card .big2{font-size:min(54px,13.5vw);line-height:.9}
.status-card p.t{font-size:17px;font-weight:600;line-height:1.3}
.hostrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- room: writing ---------- */
.prompt-card{border-radius:28px;background:var(--card);color:var(--card-fg);padding:20px 24px 24px;display:flex;flex-direction:column;gap:8px}
.prompt-card .eyebrow{color:var(--card-hi);font-size:14px;letter-spacing:.1em}
.prompt-card .disp{font-size:min(60px,15vw);line-height:.92}

.field{display:flex;flex-direction:column;gap:8px}
.field .text-in{height:68px;font-size:22px;border-color:var(--ink)}
.spicy .field .text-in{border-color:var(--plum)}
.wc{font-size:15px;font-weight:700}

.locked-box{display:flex;flex-direction:column;gap:8px}
.locked-box .disp{font-size:min(88px,22vw);line-height:.85}
.locked-box p{font-size:20px;font-weight:700;line-height:1.2}
.prog{display:flex;flex-direction:column;gap:8px}

/* ---------- room: reveal ---------- */
.reveal .rlist{display:flex;flex-direction:column;gap:10px;perspective:1000px}
.rc{cursor:pointer}
.rc .inner{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.rc.open .inner{transform:rotateX(180deg)}
.rc .face{grid-area:1/1;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:84px;display:flex;align-items:center;gap:14px;padding:14px 18px}
.rc .back{background:var(--soft);border:3px dashed var(--off);justify-content:center;font-family:var(--display);font-weight:900;font-size:44px;color:var(--hi)}
.rc .front{background:var(--c);color:var(--cf);transform:rotateX(180deg)}
.rc.cover{cursor:default}
.rc .num{flex:none;width:44px;height:44px;border-radius:22px;background:var(--cf);color:var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:26px}
.rc .a{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;min-width:0;overflow-wrap:anywhere}
.rc .a.s1{font-size:46px}.rc .a.s2{font-size:38px}.rc .a.s3{font-size:30px}.rc .a.s4{font-size:24px}
.reveal .head .disp{font-size:min(64px,16vw);line-height:.9}
.hint{border-radius:18px;background:var(--soft);padding:12px 16px;font-size:16px;font-weight:700;line-height:1.3}

/* ---------- how / rules ---------- */
.steps{display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--soft)}
.steps .num{flex:none;width:46px;height:46px;border-radius:23px;background:var(--band);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:30px}
.steps h3{font-size:34px;line-height:.95;color:var(--band)}
.steps p{font-size:17px;font-weight:600;line-height:1.3;margin-top:4px}
.rb{display:flex;flex-direction:column;gap:22px}
.rb section{display:flex;flex-direction:column;gap:8px}
.rb h3{font-size:34px;line-height:.95}
.rb p,.rb li{font-size:17px;font-weight:600;line-height:1.35}
.rb ul{display:flex;flex-direction:column;gap:6px;padding-left:20px;list-style:disc}
.rb .quote{padding:14px 18px;border-radius:18px;background:var(--ink);color:var(--cream);font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase}

/* If the display font can't load (offline), shrink the big type so nothing overflows. */
.nofont .wordmark{font-size:min(70px,17vw)}
.nofont .big{font-size:min(52px,13vw)}
.nofont .code{font-size:min(60px,15vw);letter-spacing:.08em}
.nofont .locked-box .disp{font-size:min(58px,14.5vw)}
.nofont .prompt-card .disp{font-size:min(40px,10vw)}
.nofont .reveal .head .disp{font-size:min(42px,10.5vw)}
.nofont .btn-main{font-size:min(30px,8vw)}
.nofont .count{font-size:52px}
.nofont .code-in{font-size:48px;letter-spacing:.14em}
.nofont .rc .a.s1{font-size:32px}.nofont .rc .a.s2{font-size:28px}.nofont .rc .a.s3{font-size:24px}.nofont .rc .a.s4{font-size:20px}
.nofont .steps h3,.nofont .rb h3,.nofont .sheet h3{font-size:26px}
.nofont .status-card .disp{font-size:26px}
.nofont .status-card .big2{font-size:min(38px,10vw)}
.nofont .seat{font-size:24px}
.nofont .btn-block .disp{font-size:min(28px,7.5vw)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,17,15,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 60px);overflow-y:auto;border-radius:32px 32px 0 0;background:var(--cream);color:var(--ink);padding:12px var(--gut-r) calc(26px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:14px;--btn:var(--ink);--btn-fg:var(--saffron);--fg:var(--ink);--hi:var(--ink);--focus:var(--ink)}
.sheet.dark{background:var(--plum);color:var(--cream);--btn:var(--pink);--btn-fg:var(--plum);--fg:var(--cream);--hi:var(--pink);--focus:var(--pink)}
.sheet h3{font-size:44px;line-height:.9}

    var s = S.snap; if (!s) return '';
    if (S.cm === 'closing' && !s.hidden) { clearTimeout(S.closeT); S.cm = 'open'; }
    if (S.cm === 'closing') return S.cardsCache;
    var h;
    if (s.hidden) { S.cm = 'cover'; h = coverHTML(s.orderCount); }
    else { if (S.cm === 'cover') { S.cm = 'closed'; S.flipNext = true; S.confettiNext = false; } h = faceHTML(s.order, S.cm === 'open'); }
    S.cardsCache = h; return h;
  },
  revbar: function () {
    var s = S.snap; if (!s || !s.me) return '';
    if (s.me.isHost) {
      return '<button type="button" class="btn-main" data-act="' + (s.hidden ? 'show' : 'hide') + '">' + (s.hidden ? 'Show all' : 'Hide all') + ' ' + (s.hidden ? I.eye : I.eyeoff) + '</button>' +
        '<button type="button" class="btn-ghost" data-act="end">End round</button>';
    }
    return '<p class="caption">' + esc(hostName()) + ' ends the round. The winner hosts next.</p>' +
      (s.claimable ? '<button type="button" class="btn-ghost" data-act="claim">Host is away. Take over</button>' : '');
  }
};
var REGION_AFTER = {
  settings: function (el) { var o = el.querySelector('#own'); if (o) o.value = S.draft.custom; }
};
function focusKeyIn(el) {
  var a = document.activeElement;
  if (!a || a === el || !el.contains(a)) return null;
  if (a.id) return '#' + a.id;
  var act = a.getAttribute('data-act'); if (!act) return null;
  var q = '[data-act="' + act + '"]';
  ['data-v', 'data-l', 'data-g'].forEach(function (k) { var v = a.getAttribute(k); if (v != null) q += '[' + k + '="' + String(v).replace(/"/g, '\\"') + '"]'; });
  return q;
}
function patchRegions(only) {
  var els = view.querySelectorAll('[data-r]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], n = el.getAttribute('data-r');
    if (only && n !== only) continue;
    var f = REGIONS[n]; if (!f) continue;
    var h = String(f());
    if (el._h === h) continue;
    var fk = focusKeyIn(el);
    el.innerHTML = h; el._h = h;
    if (REGION_AFTER[n]) REGION_AFTER[n](el);
    if (fk) { var nf = el.querySelector(fk); if (nf) { try { nf.focus({ preventScroll: true }); } catch (e) { nf.focus(); } } }
  }
}

/* ---------- render ---------- */
function render() {
  var key = screenKey();
  if (key !== S.key) {
    S.key = key; S.locking = false;
    flipTimers.forEach(clearTimeout); flipTimers = [];
    clearTimeout(S.closeT);
    if (key !== 'home') stopMusic();
    view.innerHTML = viewHTML();
    document.documentElement.style.setProperty('--page', pageColour());
    window.scrollTo(0, 0);
    afterMount(key);
  }
  patchRegions();
  afterPatch();
  paintSheet(); paintNet();
}
function afterMount(key) {
  if (key.indexOf('writing') === 0 && (key.indexOf('-O') > 0 || key.indexOf('-write') > 0)) setTimeout(function () { var a = $('#ans'); if (a) try { a.focus({ preventScroll: true }); } catch (e) { a.focus(); } }, 60);
  if (key === 'join') setTimeout(function () { var c = $('#code'); if (c && !S.joining) c.focus(); }, 60);
  if (key.indexOf('revealed') === 0) {
    S.cm = S.snap && S.snap.hidden ? 'cover' : (S.animateReveal ? 'closed' : 'open');
    S.flipNext = S.cm === 'closed'; S.confettiNext = S.cm === 'closed'; S.animateReveal = false;
  }
}
// After the answer cards are painted face down, flip them one by one.
function afterPatch() {
  if (S.cm !== 'closed' || !S.flipNext || !view.querySelector('.rc')) return;
  S.flipNext = false;
  var cards = view.querySelectorAll('.rc'), n = cards.length, gap = Math.min(450, 4200 / n), start = S.confettiNext ? 700 : 300;
  for (var i = 0; i < n; i++) (function (c, i) { flipTimers.push(setTimeout(function () { c.classList.add('open'); }, start + i * gap)); })(cards[i], i);
  var done = start + (n - 1) * gap + 700, withConfetti = S.confettiNext; S.confettiNext = false;
  flipTimers.push(setTimeout(function () {
    if (S.cm !== 'closed' || !S.snap || S.snap.hidden) return;
    S.cm = 'open';
    var el = view.querySelector('[data-r=cards]'); S.cardsCache = faceHTML(S.snap.order, true); if (el) el._h = S.cardsCache;
    if (withConfetti) confetti();
  }, done));
}
function closeCards() {
  view.querySelectorAll('.rc').forEach(function (c) { c.classList.remove('open'); });
  flipTimers.forEach(clearTimeout); flipTimers = [];
  S.cm = 'closing';
  clearTimeout(S.closeT);
  S.closeT = setTimeout(function () { S.cm = 'cover'; patchRegions('cards'); }, 800);
}
function paintNet() { $('#net').hidden = !(S.code && S.net === 'reconnecting'); }
function paintSheet() {
  var h = '';
  if (S.sheet === 'spicy') h = '<div class="scrim" data-act="close-bg"><div class="sheet dark" role="dialog" aria-modal="true" aria-label="NSFW room check"><span class="grab"></span><p class="eyebrow hi">NSFW · 18+</p><h3 class="disp">Adults only.</h3><p>This switches the suggestions to adult prompts and turns ' + (LOCAL ? 'the game' : 'the room') + ' plum' + (LOCAL ? '' : ' for everyone in it') + '. Only switch it on if everyone here is 18 or over and up for it.</p><button type="button" class="btn-main" data-act="spicy-yes">We’re all 18+</button><button type="button" class="btn-ghost" data-act="close">Not now</button></div></div>';
  else if (S.sheet === 'leave') {
    var lt = LOCAL ? ['Quit the game?', 'This round and its answers are lost.', 'Quit', 'Keep playing'] : ['Leave the room?', (isHost() && S.snap && S.snap.players.length > 1 ? 'Someone else becomes the host. ' : '') + 'You can come back with the code. Your codename is kept for you.', 'Leave', 'Stay'];
    h = '<div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + lt[0] + '"><span class="grab"></span><h3 class="disp">' + lt[0] + '</h3><p>' + lt[1] + '</p><button type="button" class="btn-main" data-act="leave-yes">' + lt[2] + '</button><button type="button" class="btn-ghost" data-act="close">' + lt[3] + '</button></div></div>';
  }
  if (h !== sheetHtml) {
    $('#sheet').innerHTML = h; sheetHtml = h;
    if (h) { var b = $('#sheet .btn-main'); if (b) b.focus(); }
  }
}
function go(screen) { S.screen = screen; S.joinErr = ''; render(); }

/* ---------- room flow ---------- */
function loadLearned() {
  return modeReady.then(function () { return T.categories(S.draft.spicy); }).then(function (l) { setLearned(l); patchRegions('settings'); }).catch(function () {});
}
function draftFromSnap(s) {
  var cat = s.settings.category;
  S.draft = { words: s.settings.words, spicy: s.settings.spicy, mode: cat && cat.pack === 'custom' ? 'own' : 'rec', category: cat && cat.pack !== 'custom' ? cat : null, custom: cat && cat.pack === 'custom' ? cat.label : '' };
}
function onSnap(snap) {
  var prev = S.snap; S.snap = snap;
  if (!LOCAL && snap.me && S.code) saveLast(S.code, snap.me.alias);
  var wasHostLobby = !!(prev && prev.phase === 'lobby' && prev.me && prev.me.isHost);
  if (snap.phase === 'lobby' && snap.me && snap.me.isHost && !wasHostLobby) { draftFromSnap(snap); loadLearned(); }
  if (prev && prev.phase === 'writing' && snap.phase === 'revealed') S.animateReveal = true;
  if (prev && prev.phase === 'revealed' && snap.phase === 'revealed' && !prev.hidden && snap.hidden && S.cm === 'open') closeCards();
  if (snap.phase !== 'lobby') S.sheet = null;
  if (snap.phase !== 'writing') S.locking = false;
  render();
}
function enterRoom(code) {
  S.code = code; S.snap = null; S.net = 'ok'; S.screen = 'home';
  ss.set('acq_room', code); setUrl(code); lastEvt = Date.now();
  subscribe();
  render();
}
function subscribe() {
  if (unsub) unsub();
  unsub = T.subscribe(S.code, onSnap, function (n) { S.net = n; paintNet(); }, function () { toast('That room has ended.'); clearLast(); leaveLocal(); });
}
function leaveLocal() {
  if (unsub) { unsub(); unsub = null; }
  S.code = null; S.snap = null; S.screen = 'home'; S.sheet = null; S.locking = false; S.net = 'ok';
  ss.del('acq_room'); setUrl(null); render(); patchRegions('rejoin');
}
function leaveRoom() {
  var c = S.code; clearLast(); leaveLocal();
  modeReady.then(function () { return T.act(c, { type: 'leave' }); }).catch(function () {});
}
function startRoom() {
  modeReady.then(function () { return T.create(); }).then(function (r) { S.draft = { words: 4, spicy: false, mode: 'rec', category: null, custom: '' }; enterRoom(r.code); }).catch(function (e) { toast(errMsg(e)); });
}
// Join by code. If players in a running room dropped off, offer their codenames first.
function doJoin(code, opts) {
  opts = opts || {};
  S.joining = true; S.joinErr = ''; patchRegions('joinbtn'); patchRegions('joinerr');
  modeReady.then(function () { return opts.takeover || opts.skipPicker ? null : T.info(code); }).then(function (info) {
    if (info && !info.member && info.seats && info.seats.length && (info.phase !== 'lobby' || info.round > 0)) {
      S.joining = false; S.seats = info.seats; S.seatsCode = code; S.screen = 'seats'; render(); return null;
    }
    return T.join(code, opts.takeover).then(function () { S.joining = false; enterRoom(code); });
  }).catch(function (e) {
    S.joining = false; S.joinErr = errMsg(e);
    if (e.code === 'no_room') { ss.del('acq_room'); if (readLast() && readLast().code === code) clearLast(); }
    if (e.code === 'seat_taken' || e.code === 'no_seat') toast(errMsg(e));
    if (S.screen !== 'join') { S.screen = 'join'; S.joinCode = code; }
    render(); patchRegions('joinbtn'); patchRegions('joinerr'); patchRegions('rejoin');
  });
}
function pushSettings(now) {
  clearTimeout(pushTimer);
  var send = function () {
    if (!S.code || !isHost() || S.snap.phase !== 'lobby') return;
    var d = S.draft;
    T.act(S.code, { type: 'settings', words: d.words, spicy: d.spicy, category: effCategory() }).catch(function () {});
  };
  if (now) send(); else pushTimer = setTimeout(send, 250);
}
function draftChanged(now) { patchRegions('settings'); patchRegions('start'); pushSettings(now); }
function copyLink() {
  var link = roomLink();
  var done = function () { toast('Link copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { fallbackCopy(link); });
  else fallbackCopy(link);
}
function fallbackCopy(text) {
  var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(t); toast(ok ? 'Link copied' : 'Copy this: ' + text);
}
function send(action) { return T.act(S.code, action).catch(function (e) { toast(errMsg(e)); }); }

/* ---------- actions ---------- */
var ACT = {
  music: function () {
    if (S.music) { S.music = false; Music.stop(); } else { S.music = Music.start(); }
    patchRegions('music');
  },
  start: function () { startRoom(); },
  join: function () { S.joinCode = ''; go('join'); },
  rejoin: function () { var l = readLast(); if (l) doJoin(l.code, { takeover: l.alias || undefined, skipPicker: true }); },
  how: function () { go('how'); }, rules: function () { go('rules'); },
  back: function () { go('home'); },
  'back-join': function () { go('join'); },
  seat: function (t) { doJoin(S.seatsCode, { takeover: t.getAttribute('data-alias') }); },
  'seat-new': function () { doJoin(S.seatsCode, { skipPicker: true }); },
  leave: function () { S.sheet = 'leave'; paintSheet(); },
  'leave-yes': function () { S.sheet = null; paintSheet(); leaveRoom(); },
  close: function () { S.sheet = null; paintSheet(); },
  'close-bg': function (t, e) { if (e.target === t) { S.sheet = null; paintSheet(); } },
  copy: copyLink,
  share: function () { try { navigator.share({ title: 'Acquire', text: 'Join my Acquire room', url: roomLink() }).catch(function () {}); } catch (e) { copyLink(); } },
  claim: function () { send({ type: 'claim' }); },
  release: function () { clearTimeout(pushTimer); send({ type: 'release' }); },
  'w-': function () { S.draft.words = Math.max(1, S.draft.words - 1); draftChanged(); },
  'w+': function () { S.draft.words = Math.min(12, S.draft.words + 1); draftChanged(); },
  content: function (t) {
    var nsfw = t.getAttribute('data-v') === 'nsfw';
    if (nsfw === S.draft.spicy) return;
    if (nsfw) { S.sheet = 'spicy'; paintSheet(); return; }
    S.draft.spicy = false;
    if (S.draft.category && S.draft.category.pack === 'nsfw') S.draft.category = null;
    draftChanged(true); loadLearned();
  },
  'spicy-yes': function () {
    S.sheet = null; paintSheet();
    S.draft.spicy = true;
    if (S.draft.category && S.draft.category.pack === 'pg13') S.draft.category = null;
    draftChanged(true); loadLearned();
  },
  mode: function (t) { S.draft.mode = t.getAttribute('data-v'); draftChanged(); },
  expand: function (t) { var k = t.getAttribute('data-g'); S.expanded[k] = !S.expanded[k]; patchRegions('settings'); },
  tile: function (t) {
    var l = t.getAttribute('data-l'), p = t.getAttribute('data-p');
    if (S.draft.mode === 'own') S.draft.custom = l; else S.draft.category = { label: l, pack: p };
    draftChanged();
  },
  surprise: function () {
    var nsfw = S.draft.spicy, pool = flat(nsfw ? NSFW : SFW).map(function (l) { return { l: l, p: nsfw ? 'nsfw' : 'pg13' }; });
    communityItems().forEach(function (c) { pool.push({ l: c.l, p: c.pack }); });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    S.draft.category = { label: pick.l, pack: pick.p }; draftChanged();
    var tile = view.querySelector('.tile.picked'); if (tile && tile.scrollIntoView) { try { tile.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) {} }
  },
  begin: function () {
    var c = canStart(); if (!c.ok) { if (c.why) toast(c.why); return; }
    var d = S.draft; clearTimeout(pushTimer);
    send({ type: 'start', settings: { words: d.words, spicy: d.spicy, category: effCategory() } });
  },
  lock: function () {
    var a = curAns(); if (!a.ok || S.locking) return;
    S.locking = true; patchRegions('lockbtn');
    T.act(S.code, { type: 'submit', text: a.text }).catch(function (e) { S.locking = false; patchRegions('lockbtn'); toast(errMsg(e)); });
  },
  ready: function () { T.ready(); },
  'p-': function () { T.setPlayers(S.snap.players.length - 1); },
  'p+': function () { T.setPlayers(S.snap.players.length + 1); },
  reveal: function () { send({ type: 'reveal' }); },
  hide: function () { send({ type: 'hide' }); },
  show: function () { send({ type: 'show' }); },
  end: function () { send({ type: 'end' }); },
  flip: function (t) { if (!t.classList.contains('cover')) t.classList.add('open'); }
};

var app = $('#app');
app.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  var f = ACT[t.getAttribute('data-act')]; if (f) f(t, e);
});
app.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'ans') { patchRegions('wc'); patchRegions('lockbtn'); }
  else if (t.id === 'own') { S.draft.custom = t.value; patchRegions('start'); pushSettings(false); }
  else if (t.id === 'code') {
    var v = t.value.replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 4);
    if (v !== t.value) t.value = v;
    S.joinCode = v; S.joinErr = ''; patchRegions('joinerr'); patchRegions('joinbtn');
  }
});
app.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.getAttribute('data-form') === 'join' && S.joinCode.length === 4 && !S.joining) doJoin(S.joinCode);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); ACT.lock(); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; paintSheet(); }
});

/* ---------- stay live: reconnect after the phone sleeps or the network blips ---------- */
function stale() { return S.code && S.mode === 'live' && Date.now() - lastEvt > 45000; }
document.addEventListener('visibilitychange', function () { if (!document.hidden && stale()) subscribe(); });
window.addEventListener('online', function () { if (S.code && S.mode === 'live') subscribe(); });
setInterval(function () { if (!document.hidden && stale()) subscribe(); }, 15000);

/* ---------- font fallback check ---------- */
function checkFonts() {
  try {
    var a = document.createElement('span'), b = document.createElement('span');
    var base = 'position:absolute;visibility:hidden;left:-9999px;top:0;font-size:60px;font-weight:900;white-space:nowrap;';
    a.style.cssText = base + "font-family:'Big Shoulders',monospace"; b.style.cssText = base + 'font-family:monospace';
    a.textContent = b.textContent = 'ACQUIREmmmWWW 0123';
    document.body.appendChild(a); document.body.appendChild(b);
    var missing = Math.abs(a.offsetWidth - b.offsetWidth) < 1;
    document.body.removeChild(a); document.body.removeChild(b);
    document.documentElement.classList.toggle('nofont', missing);
  } catch (e) {}
}
setTimeout(checkFonts, 2500);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(checkFonts, 150); });
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { setTimeout(checkFonts, 150); });

/* ---------- boot ---------- */
render();
modeReady.then(function (m) {
  if (m !== 'live') return;
  var uc = urlCode(), saved = ss.get('acq_room');
  if (uc) { S.joinCode = uc; S.screen = 'join'; render(); doJoin(uc); }
  else if (saved && /^[A-Z]{4}$/.test(saved)) {
    T.join(saved).then(function () { enterRoom(saved); }).catch(function () { ss.del('acq_room'); });
  }
});
})();
</script>
