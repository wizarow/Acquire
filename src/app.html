<style>
/* Acquire. Every phase paints the whole screen in its own colour. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#14110F; --cream:#FFF4E0; --cobalt:#2B2FE0; --cobalt-deep:#1C1FA6;
  --saffron:#FFC21A; --mint:#2EE59D; --tomato:#FF5B2E;
  --plum:#1A0712; --plum-2:#3A0F28; --pink:#FF2E88;
  --rule:#3A332D; --muted:#D9CCB6; --disabled:#8A7F70;
  --display:'Big Shoulders','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --page:var(--cobalt);
  --gut-l:max(22px,env(safe-area-inset-left,0px));
  --gut-r:max(22px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
html,body{margin:0;min-height:100%;background:var(--page)}
body{color:var(--cream);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none}
[hidden],[data-r]:empty{display:none!important}
:focus-visible{outline:3px solid var(--focus,#fff);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- palettes ---------- */
.scr{--bg:var(--cobalt);--fg:var(--cream);--btn:var(--saffron);--btn-fg:var(--ink);--hi:var(--saffron);--off:rgba(255,244,224,.24);--focus:var(--cream);
  --chip:var(--mint);--chip-fg:var(--ink);--chip-line:var(--mint);--soft:var(--cobalt-deep);
  background:var(--bg);color:var(--fg);max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.pal-yellow{--bg:var(--saffron);--fg:var(--ink);--btn:var(--ink);--btn-fg:var(--saffron);--hi:var(--ink);--focus:var(--ink);--off:rgba(20,17,15,.2);
  --chip:var(--cream);--chip-fg:var(--ink);--chip-line:var(--ink);--soft:rgba(20,17,15,.1);
  --seg:var(--ink);--seg-fg:var(--cream);--seg-on:var(--saffron);--seg-on-fg:var(--ink);--tile:var(--cream);--tile-fg:var(--ink);--tile-line:var(--ink)}
.pal-green{--bg:var(--mint);--fg:var(--ink);--btn:var(--ink);--btn-fg:var(--mint);--hi:var(--ink);--focus:var(--ink);--off:rgba(20,17,15,.2);--card:var(--ink);--card-fg:var(--cream);--card-hi:var(--mint);--soft:rgba(20,17,15,.1)}
.pal-dark{--bg:var(--ink);--fg:var(--cream);--btn:var(--saffron);--btn-fg:var(--ink);--hi:var(--saffron);--soft:#26211D}
.pal-paper{--bg:var(--cream);--fg:var(--ink);--btn:var(--ink);--btn-fg:var(--saffron);--hi:var(--ink);--focus:var(--ink);--soft:rgba(20,17,15,.08)}
/* NSFW rooms */
.spicy.pal-blue,.spicy.pal-dark{--bg:var(--plum);--fg:var(--cream);--btn:var(--pink);--btn-fg:var(--plum);--hi:var(--pink);--focus:var(--pink);--chip:var(--pink);--chip-fg:var(--plum);--chip-line:var(--pink);--soft:var(--plum-2)}
.spicy.pal-yellow{--bg:var(--plum);--fg:var(--cream);--btn:var(--pink);--btn-fg:var(--plum);--hi:var(--pink);--focus:var(--pink);--off:rgba(255,244,224,.24);--chip:var(--plum-2);--chip-fg:var(--cream);--chip-line:var(--pink);--soft:var(--plum-2);
  --seg:var(--plum-2);--seg-fg:var(--cream);--seg-on:var(--pink);--seg-on-fg:var(--plum);--tile:var(--cream);--tile-fg:var(--ink);--tile-line:var(--cream)}
.spicy.pal-green{--bg:var(--pink);--fg:var(--plum);--btn:var(--plum);--btn-fg:var(--pink);--hi:var(--plum);--focus:var(--plum);--off:rgba(26,7,18,.25);--card:var(--plum);--card-fg:var(--cream);--card-hi:var(--pink);--soft:rgba(26,7,18,.12)}

/* ---------- shared ---------- */
.pad{padding:20px var(--gut-r) 26px var(--gut-l);display:flex;flex-direction:column;gap:22px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.disp{font-family:var(--display);font-weight:900;text-transform:uppercase;text-wrap:balance;overflow-wrap:break-word}
.big{font-size:min(64px,16vw);line-height:.9}
.eyebrow{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.eyebrow.hi{color:var(--hi)}
.circle{width:52px;height:52px;flex:none;border-radius:26px;border:3px solid var(--fg);background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.circle.sp{visibility:hidden}
.btn-main{min-height:84px;border-radius:24px;border:none;background:var(--btn);color:var(--btn-fg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 24px 0 26px;font-family:var(--display);font-weight:900;font-size:min(42px,10.5vw);text-transform:uppercase;cursor:pointer;width:100%;text-align:left}
.btn-main svg{flex:none}
.btn-main[disabled]{background:var(--rule);color:var(--muted);cursor:not-allowed}
.pal-green .btn-main[disabled],.pal-yellow .btn-main[disabled]{background:rgba(20,17,15,.28);color:var(--fg)}
.btn-main.sm{min-height:64px;font-size:min(30px,8vw)}
.btn-ghost{min-height:62px;border-radius:22px;border:3px solid var(--fg);background:transparent;color:var(--fg);font-size:20px;font-weight:800;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-ghost.sm{min-height:50px;font-size:17px;border-radius:18px}
.btn-ghost[disabled]{opacity:.4;cursor:not-allowed}
.caption{font-size:15px;font-weight:600;text-align:center;line-height:1.3}
.note{font-size:15px;font-weight:600;line-height:1.3}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{min-height:28px;padding:0 10px;border-radius:14px;border:2px solid currentColor;display:inline-flex;align-items:center;font-size:13px;font-weight:800;white-space:nowrap}
.tag.prev{border-style:dashed;align-self:flex-start}
.tag.me{max-width:48%;overflow:hidden;text-overflow:ellipsis}
.badge18{font-family:var(--display);font-weight:900;font-size:18px;padding:2px 8px;border-radius:8px;border:2px solid currentColor;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pl{min-height:40px;padding:0 15px;border-radius:20px;background:var(--chip);color:var(--chip-fg);border:2.5px solid var(--chip-line);display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.pl small{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.pl.off{opacity:.4}
.pl.me{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.pips{display:grid;gap:6px}
.pips i{height:9px;border-radius:5px;background:var(--off)}
.pips i.on{background:var(--hi)}
.pchip{min-height:34px;padding:0 12px;border-radius:17px;border:2.5px solid var(--fg);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;max-width:100%;overflow-wrap:anywhere}
.pchip small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.pchip.away{border-style:dashed;opacity:.7}
.pad>[data-r=timer]:empty{display:none}
.timer{display:flex;align-items:center;gap:14px;padding:10px 16px;border:3px solid var(--fg);border-radius:18px}
.timer .tnum{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;font-variant-numeric:tabular-nums;min-width:2.3ch}
.timer .tside{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer .tlab{font-size:14px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.timer .tbar{height:9px;border-radius:5px;background:var(--off);overflow:hidden}
.timer .tbar i{display:block;height:100%;border-radius:5px;background:var(--hi)}
.timer.urgent,.timer.up{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.timer.urgent .tbar,.timer.up .tbar{background:rgba(128,128,128,.4)}
.timer.urgent .tbar i{background:var(--btn-fg)}

/* ---------- home ---------- */
.home .pad{justify-content:space-between}
.wordmark{font-size:min(104px,25vw);line-height:.82;letter-spacing:-.01em}
.tagline{font-size:27px;line-height:1.15;font-weight:700;max-width:340px}
.hero{display:flex;flex-direction:column;gap:22px}
.flips{display:flex;gap:8px;padding:2px 0}
.flips i{width:36px;height:36px;border-radius:50%;border:3px solid var(--fg);animation:fd 4.2s ease-in-out infinite;animation-delay:calc(var(--i)*.22s)}
@keyframes fd{
  0%,36%{transform:scaleX(1);background:transparent;border-color:var(--fg)}
  44%{transform:scaleX(0);background:transparent;border-color:var(--fg)}
  45%{transform:scaleX(0);background:var(--c);border-color:var(--c)}
  53%,86%{transform:scaleX(1);background:var(--c);border-color:var(--c)}
  94%{transform:scaleX(0);background:var(--c);border-color:var(--c)}
  95%{transform:scaleX(0);background:transparent;border-color:var(--fg)}
  100%{transform:scaleX(1);background:transparent;border-color:var(--fg)}}
.topbtn{min-height:40px;padding:0 16px;border-radius:20px;border:3px solid var(--fg);background:transparent;color:var(--fg);display:inline-flex;align-items:center;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn-block{min-height:92px;border-radius:24px;border:none;background:var(--blk,var(--cream));color:var(--blk-fg,var(--ink));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px 0 26px;cursor:pointer;width:100%;text-align:left}
.btn-block .t{display:flex;flex-direction:column;gap:3px}
.btn-block .disp{font-size:min(38px,9.5vw);line-height:.95}
.btn-block small{font-size:14px;font-weight:700}

/* ---------- join / seats ---------- */
.code-in{width:100%;height:96px;border-radius:24px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);text-align:center;font-family:var(--display);font-weight:900;font-size:68px;letter-spacing:.22em;padding-left:.22em;text-transform:uppercase;outline:none}
.code-in::placeholder{color:#B8AA92}
.code-in:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.err{min-height:22px;font-size:16px;font-weight:800;color:var(--err,var(--saffron))}
.join-form{display:flex;flex-direction:column;gap:14px}
.seatlist{display:flex;flex-direction:column;gap:10px}
.seat{min-height:64px;border-radius:20px;border:3px solid var(--fg);background:transparent;color:var(--fg);font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;cursor:pointer;text-align:left;padding:0 22px}
//#if online
@media (hover:hover) and (pointer:fine){.seat:hover{background:var(--fg);color:var(--bg)}}
//#else
.seat:hover{background:var(--fg);color:var(--bg)}
//#endif

/* ---------- room: lobby ---------- */
.setup .pad{gap:16px}
.codebox{border-radius:26px;background:var(--bg);border:3px solid var(--fg);padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.code{font-size:min(92px,24vw);line-height:.85;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.codebox .acts{display:flex;gap:8px;flex-wrap:wrap}
.mini{min-height:42px;padding:0 16px;border-radius:21px;border:none;background:var(--btn);color:var(--btn-fg);font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mini.line{background:transparent;border:2.5px solid var(--fg);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:19px;font-weight:800}
.sub{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.who{font-size:18px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.stepper .minus{border:3px solid var(--fg);background:transparent;color:var(--fg)}
.stepper .plus{border:none;background:var(--btn);color:var(--btn-fg)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.count{width:76px;text-align:center;font-family:var(--display);font-weight:900;font-size:68px;line-height:.9;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border-radius:18px;background:var(--seg,var(--ink))}
.seg button{height:46px;border-radius:13px;border:none;background:transparent;color:var(--seg-fg,var(--cream));font-size:15px;font-weight:800;padding:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on,var(--saffron));color:var(--seg-on-fg,var(--ink))}
.seg button[data-v="nsfw"][aria-pressed="true"]{background:var(--pink);color:var(--plum)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{min-height:50px;border-radius:14px;border:2.5px solid var(--tile-line,var(--ink));background:var(--tile,var(--cream));color:var(--tile-fg,var(--ink));font-size:15px;font-weight:800;line-height:1.05;padding:4px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile small{font-size:12px;opacity:.7}
.tile.wild{background:var(--wild,var(--ink));color:var(--wild-fg,var(--saffron));border-color:var(--wild-line,var(--ink));grid-column:1/-1}
.spicy .tile.wild{background:transparent;color:var(--cream);border-color:var(--cream)}
.tile.spice{background:var(--plum);color:var(--pink);border-color:var(--plum)}
.spicy .tile.spice{background:var(--pink);color:var(--plum);border-color:var(--pink)}
.tile.picked{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg)}
.more{min-height:40px;border-radius:20px;border:2.5px dashed currentColor;background:transparent;color:inherit;font-size:14px;font-weight:800;cursor:pointer;align-self:center;padding:0 18px}
.text-in{height:60px;width:100%;border-radius:18px;border:3px solid var(--ink);background:var(--cream);padding:0 16px;font-size:19px;font-weight:700;color:var(--ink);outline:none}
.spicy .text-in{border-color:var(--pink)}
.text-in::placeholder{color:#6B5E4A}
.text-in:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.startbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:2;margin-top:auto}
.status-card{border-radius:24px;background:var(--soft);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.status-card .disp{font-size:34px;line-height:.95}
.status-card .big2{font-size:min(54px,13.5vw);line-height:.9}
.status-card p.t{font-size:17px;font-weight:600;line-height:1.3}
.hostrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- room: writing ---------- */
.prompt-card{border-radius:28px;background:var(--card);color:var(--card-fg);padding:20px 24px 24px;display:flex;flex-direction:column;gap:8px}
.prompt-card .eyebrow{color:var(--card-hi);font-size:14px;letter-spacing:.1em}
.prompt-card .disp{font-size:min(60px,15vw);line-height:.92}
.prompt-card .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.field{display:flex;flex-direction:column;gap:8px}
.field .text-in{height:68px;font-size:22px;border-color:var(--ink)}
.spicy .field .text-in{border-color:var(--plum)}
.wc{font-size:15px;font-weight:700}
.wc.bad{color:var(--bad,#B3001B)}
.spicy .wc.bad{color:var(--plum);text-decoration:underline wavy}
.locked-box{display:flex;flex-direction:column;gap:8px}
.locked-box .disp{font-size:min(88px,22vw);line-height:.85}
.locked-box p{font-size:20px;font-weight:700;line-height:1.2}
.prog{display:flex;flex-direction:column;gap:8px}

/* ---------- room: reveal ---------- */
.reveal .rlist{display:flex;flex-direction:column;gap:10px;perspective:1000px}
.rc{cursor:pointer}
.rc .inner{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.rc.open .inner{transform:rotateX(180deg)}
.rc .face{grid-area:1/1;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:84px;display:flex;align-items:center;gap:14px;padding:14px 18px}
.rc .back{background:var(--soft);border:3px dashed var(--off);justify-content:center;font-family:var(--display);font-weight:900;font-size:44px;color:var(--hi)}
.rc .front{background:var(--c);color:var(--cf);transform:rotateX(180deg)}
.rc.cover{cursor:default}
.rc .num{flex:none;width:44px;height:44px;border-radius:22px;background:var(--cf);color:var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:26px}
.rc .a{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;min-width:0;overflow-wrap:anywhere}
.rc .a.s1{font-size:calc(46px*var(--fs,1))}.rc .a.s2{font-size:calc(38px*var(--fs,1))}.rc .a.s3{font-size:calc(30px*var(--fs,1))}.rc .a.s4{font-size:calc(24px*var(--fs,1))}
.reveal .head .disp{font-size:min(64px,16vw);line-height:.9}
.hint{border-radius:18px;background:var(--soft);padding:12px 16px;font-size:16px;font-weight:700;line-height:1.3}

/* ---------- how / rules ---------- */
.steps{display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--soft)}
.steps .num{flex:none;width:46px;height:46px;border-radius:23px;background:var(--band);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:30px}
.steps h3{font-size:34px;line-height:.95;color:var(--band)}
.steps p{font-size:17px;font-weight:600;line-height:1.3;margin-top:4px}
.rb{display:flex;flex-direction:column;gap:22px}
.rb section{display:flex;flex-direction:column;gap:8px}
.rb h3{font-size:34px;line-height:.95}
.rb p,.rb li{font-size:17px;font-weight:600;line-height:1.35}
.rb ul{display:flex;flex-direction:column;gap:6px;padding-left:20px;list-style:disc}
.rb .quote{padding:14px 18px;border-radius:18px;background:var(--ink);color:var(--cream);font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase}

/* If the display font can't load (offline), shrink the big type so nothing overflows. */
.nofont .wordmark{font-size:min(70px,17vw)}
.nofont .big{font-size:min(52px,13vw)}
.nofont .code{font-size:min(60px,15vw);letter-spacing:.08em}
.nofont .locked-box .disp{font-size:min(58px,14.5vw)}
.nofont .prompt-card .disp{font-size:min(40px,10vw)}
.nofont .reveal .head .disp{font-size:min(42px,10.5vw)}
.nofont .btn-main{font-size:min(30px,8vw)}
.nofont .count{font-size:52px}
.nofont .code-in{font-size:48px;letter-spacing:.14em}
.nofont .rc .a.s1{font-size:calc(32px*var(--fs,1))}.nofont .rc .a.s2{font-size:calc(28px*var(--fs,1))}.nofont .rc .a.s3{font-size:calc(24px*var(--fs,1))}.nofont .rc .a.s4{font-size:calc(20px*var(--fs,1))}
.nofont .steps h3,.nofont .rb h3,.nofont .sheet h3{font-size:26px}
.nofont .status-card .disp{font-size:26px}
.nofont .status-card .big2{font-size:min(38px,10vw)}
.nofont .seat{font-size:24px}
.nofont .btn-block .disp{font-size:min(28px,7.5vw)}

//#if online
/* ---------- online only: text size, colour schemes, settings sheet ---------- */

.row>.eyebrow{font-size:.9375rem}
.hint,.caption,.note,.status-card p.t,.locked-box p{overflow-wrap:anywhere}
.pl{max-width:100%;flex-wrap:wrap;row-gap:0}

.gearbtn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}

.ver{position:absolute;left:0;right:0;top:max(3px,env(safe-area-inset-top,0px));text-align:center;font-size:.8125rem;font-weight:700;letter-spacing:.08em;opacity:.55;pointer-events:none}
.namerow{display:flex;gap:8px;align-items:center}

.seg.fx button{font-size:.9375rem}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.theme{min-height:52px;border-radius:16px;border:3px solid var(--fg);background:transparent;color:var(--fg);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:16px;font-weight:800;cursor:pointer;text-align:left;min-width:0}
.theme:last-child:nth-child(odd){grid-column:1/-1}
.theme .sw{flex:none;width:26px;height:26px;border-radius:13px;border:2px solid currentColor;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.sheet .theme[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.rmlist{display:flex;flex-direction:column}

.rmn small{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.rmb{display:flex;gap:6px;flex:none}

//#if demo
#demobar{position:sticky;top:0;z-index:50;background:#14110F;color:#FFF4E0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;font:700 12px/1.25 var(--body);border-bottom:2px solid #FFC21A}

/* ---------- transports ---------- */
function api(path, method, body) {
  return fetch(path, {
    method: method || 'GET', cache: 'no-store',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (j) {
      if (!res.ok) throw { code: j.error || ('http_' + res.status), by: j.by };
      return j;
    });
  }, function () { throw { code: 'network' }; });
}

var Live = {
  create: function (name) { return api('/api/rooms', 'POST', { pid: pid, name: name || undefined }); },
  info: function (code) { return api('/api/rooms/' + code + '/info?pid=' + encodeURIComponent(pid)); },
  join: function (code, takeover, name) { return api('/api/rooms/' + code + '/join', 'POST', { pid: pid, takeover: takeover || undefined, name: name || undefined }); },
  act: function (code, action) { return api('/api/rooms/' + code + '/act', 'POST', { pid: pid, action: action }); },
  subscribe: function (code, onSnap, onNet, onGone) {
    var es = new EventSource('/api/rooms/' + code + '/events?pid=' + encodeURIComponent(pid));
    es.addEventListener('snapshot', function (e) { lastEvt = Date.now(); try { onSnap(JSON.parse(e.data)); } catch (x) {} });
    es.addEventListener('tick', function () { lastEvt = Date.now(); });
    es.addEventListener('closed', function () { es.close(); onGone(); });
    es.addEventListener('removed', function () { es.close(); onGone('removed'); });
    es.onopen = function () { lastEvt = Date.now(); onNet('ok'); };
    es.onerror = function () { if (es.readyState === 2) { es.close(); onGone(); } else onNet('reconnecting'); };
    return function () { es.close(); };
  }
};

  bar.addEventListener('change', function (e) { if (e.target.id === 'dbauto') Demo.auto(e.target.checked); });
})();
//#endif
var app = $('#app');
app.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  var f = ACT[t.getAttribute('data-act')]; if (f) f(t, e);
});
app.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'ans') { patchRegions('wc'); patchRegions('lockbtn'); }
  else if (t.id === 'own') { S.draft.custom = t.value; patchRegions('start'); pushSettings(false); }
  else if (t.id && t.id.indexOf('uname-') === 0) { S.nameDraft = t.value; }
  else if (t.id === 'code') {
    var v = t.value.replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 4);
    if (v !== t.value) t.value = v;
    S.joinCode = v; S.joinErr = ''; patchRegions('joinerr'); patchRegions('joinbtn');
  }
});
app.addEventListener('submit', function (e) {
  e.preventDefault();
  var fm = e.target.getAttribute('data-form');
  if (fm === 'join' && S.joinCode.length === 4 && !S.joining) doJoin(S.joinCode);
  //#if online
  if (fm === 'name') { var ni = e.target.querySelector('input'); if (ni) setName(ni.value); }
  //#endif
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); ACT.lock(); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; paintSheet(); }
});

/* ---------- stay live: reconnect after the phone sleeps or the network blips ---------- */
function stale() { return S.code && S.mode === 'live' && Date.now() - lastEvt > 45000; }
document.addEventListener('visibilitychange', function () { if (!document.hidden && stale()) subscribe(); });
window.addEventListener('online', function () { if (S.code && S.mode === 'live') subscribe(); });
setInterval(function () { if (!document.hidden && stale()) subscribe(); }, 15000);

/* ---------- font fallback check ---------- */
function checkFonts() {
  try {
    var a = document.createElement('span'), b = document.createElement('span');
    var base = 'position:absolute;visibility:hidden;left:-9999px;top:0;font-size:60px;font-weight:900;white-space:nowrap;';
    a.style.cssText = base + "font-family:'Big Shoulders',monospace"; b.style.cssText = base + 'font-family:monospace';
    a.textContent = b.textContent = 'ACQUIREmmmWWW 0123';
    document.body.appendChild(a); document.body.appendChild(b);
    var missing = Math.abs(a.offsetWidth - b.offsetWidth) < 1;
    document.body.removeChild(a); document.body.removeChild(b);
    document.documentElement.classList.toggle('nofont', missing);
  } catch (e) {}
}
setTimeout(checkFonts, 2500);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(checkFonts, 150); });
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { setTimeout(checkFonts, 150); });

/* ---------- boot ---------- */
//#if online
loadUI(); applyUI();
//#endif
render();
modeReady.then(function (m) {
  if (m !== 'live') return;
  var uc = urlCode(), saved = ss.get('acq_room');
  if (uc) { S.joinCode = uc; S.screen = 'join'; render(); doJoin(uc); }
  else if (saved && /^[A-Z]{4}$/.test(saved)) {
    T.join(saved).then(function () { enterRoom(saved); }).catch(function () { ss.del('acq_room'); });
  }
});
})();
</script>
